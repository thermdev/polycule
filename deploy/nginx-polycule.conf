# Polycule reverse proxy.
#
# Install to /etc/nginx/sites-available/polycule and symlink into
# sites-enabled. This file is HTTP-only on purpose: run certbot afterwards
# and it will rewrite this block to add listen 443, the certificate paths,
# and an HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;

    server_name polycule.example.com;

    # Image uploads arrive as base64 data URLs in a JSON body. The server caps
    # bodies at 32mb (MAX_BODY in server/index.js); base64 inflates bytes by
    # ~4/3, so a 12MB image lands around 16MB. Keep these two in sync.
    client_max_body_size 32m;

    # The client bundle is ~775KB uncompressed (three.js dominates). Text
    # compression is the single biggest win for first paint here.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    access_log /var/log/nginx/polycule.access.log;
    error_log  /var/log/nginx/polycule.error.log;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large uploads can take a while on a slow uplink.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # --- Optional: gate the whole app behind a password. -------------
        # The API has no authentication of its own, so without this anyone
        # who finds the URL can read, edit and delete every polycule.
        # Create the password file with:
        #   sudo apt install -y apache2-utils
        #   sudo htpasswd -c /etc/nginx/.htpasswd yourname
        #
        # auth_basic           "Polycule";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
